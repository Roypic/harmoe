[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoe-cxr"
version = "0.1.0"
description = "Dataset-routed residual experts for multi-source chest radiograph pretraining"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["harmoe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
